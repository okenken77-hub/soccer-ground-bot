name: check-availability

on:
  schedule:
    - cron: "5 */3 * * *" # UTC。日本時間では 9:05, 12:05, 15:05 ... の約3時間ごと
  workflow_dispatch:
    inputs:
      test_notify:
        description: "通知テスト(Issueを1件作ってメールを送る。空きチェックはしない)"
        type: boolean
        default: false

concurrency:
  group: check-availability
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  notify-test:
    if: ${{ inputs.test_notify }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create test issue
        run: |
          gh issue create --repo "${{ github.repository }}" --title "テスト通知 $(TZ=Asia/Tokyo date '+%m/%d %H:%M')" --body "@${{ github.repository_owner }} これは通知テストです。このメールが届けば、空きが出たときの通知も届きます。"

  check:
    if: ${{ !inputs.test_notify }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run checker
        id: run
        run: |
          set +e
          node check_availability.js > result.txt 2> stderr.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          echo "--- stdout ---"; cat result.txt
          echo "--- stderr ---"; cat stderr.txt

      - name: Commit latest state and summary
        if: steps.run.outputs.code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json availability_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "update: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Notify by issue (new openings only)
        if: steps.run.outputs.code == '0'
        run: |
          if grep -q '^NEW_OPENINGS_FOUND' result.txt; then
            sed -n '/^NEW_OPENINGS_FOUND/,$p' result.txt | tail -n +2 | grep . > lines.txt
            N=$(wc -l < lines.txt)
            {
              echo "@${{ github.repository_owner }} 新しく空きが出ました(${N}件)。"
              echo
              echo "時刻は「17-21:30」= 17:00〜21:30 の意味です。予約・問い合わせは各施設へ(電話番号は一覧ページの末尾にあります)。"
              echo
              sed 's/^/- /' lines.txt
              echo
              echo "## 今のおすすめ TOP5(2時間以上の枠・点数順)"
              echo
              cat availability_recommend.md
              echo
              echo "全体の一覧: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/availability_summary.md"
            } > issue.md
            gh issue create --title "空きが出ました(${N}件) $(TZ=Asia/Tokyo date '+%m/%d %H:%M')" --body-file issue.md
          fi

      - name: Fail if the checker crashed
        if: steps.run.outputs.code != '0'
        run: |
          echo "checker failed (exit ${{ steps.run.outputs.code }})"
          exit 1
